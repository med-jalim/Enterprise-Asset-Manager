spring:
  application:
    name: asset-app
  datasource:
    url: jdbc:postgresql://localhost:5432/asset-app-db
    driver-class-name: org.postgresql.Driver
    username: asset-app-user
    password: asset-app-user123

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
  
  mvc:
    apiversion:
      use:
        path-segment:  0
      required: true

server:
  servlet:
    context-path: /api


