spring:
  application:
    name: asset-app
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}

  cloud:
    openfeign:
      client:
        config:
          employee-app:
            url: ${EMPLOYEE_API_URL}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
  
  mvc:
    apiversion:
      use:
        path-segment:  0
      required: true

  security:
        oauth2:
            resourceserver:
                jwt:
                    issuer-uri: ${OAUTH2_ISSUER_URI}

server:
  servlet:
    context-path: /api


